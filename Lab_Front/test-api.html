<!DOCTYPE html>
<html>
<head>
    <title>Test API</title>
</head>
<body>
    <h1>Teste de API</h1>
    <button onclick="testAPI()">Testar Conexão</button>
    <div id="result"></div>
    
    <script>
        async function testAPI() {
            try {
                console.log('Fazendo requisição para API...');
                const response = await fetch('http://localhost:8003/alunos');
                console.log('Response status:', response.status);
                
                const data = await response.json();
                console.log('Dados recebidos:', data);
                
                document.getElementById('result').innerHTML = `
                    <h3>Resultados:</h3>
                    <p>Status: ${response.status}</p>
                    <p>Quantidade: ${data.length}</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('result').innerHTML = `<p style="color: red">Erro: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
