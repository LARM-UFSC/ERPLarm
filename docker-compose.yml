version: '3.8'

services:
  # Backend FastAPI
  backend:
    build: ./Lab_back
    container_name: lab_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/lab_db
      - CORS_ORIGINS=http://localhost:3000,http://localhost:80
      - PYTHONUNBUFFERED=1
    depends_on:
      - db
    volumes:
      - ./Lab_back:/app
    networks:
      - lab_network
    restart: unless-stopped

  # Frontend React/Vite
  frontend:
    build: ./Lab_Front
    container_name: lab_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - lab_network
    restart: unless-stopped

  # Banco de dados PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: lab_db
    environment:
      - POSTGRES_DB=lab_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - lab_network
    restart: unless-stopped

  # Redis para cache (opcional)
  redis:
    image: redis:7-alpine
    container_name: lab_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lab_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  lab_network:
    driver: bridge
